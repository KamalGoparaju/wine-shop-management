services:
  - type: web
    name: wineshop-backend
    runtime: node
    plan: free
    buildCommand: npm run render:build
    startCommand: npm run start:backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wineshop-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@wineshop.com
      - key: ADMIN_PASSWORD
        value: Admin@123
      - key: AUTH_PORT
        value: 5001
      - key: INVENTORY_PORT
        value: 5002
      - key: SALES_PORT
        value: 5003

databases:
  - name: wineshop-db
    databaseName: wineshop
    user: wineshop_user
    plan: free
